spring:
  application:
    name: IssueTracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${ATTACHMENTS_MAX_SIZE:10MB}
      max-request-size: ${ATTACHMENTS_MAX_SIZE:10MB}

jwt:
  # No fallback on purpose: starting with a predictable, publicly-known secret would let anyone
  # forge valid tokens. The app must refuse to start rather than run with a guessable key.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  # Refresh tokens are opaque random strings stored in the DB (see RefreshToken), not signed
  # JWTs, so no secret is needed for them - just how long one stays valid. Default 7 days.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  attachments:
    storage-dir: ${ATTACHMENTS_DIR:uploads}
    allowed-content-types: ${ATTACHMENTS_ALLOWED_TYPES:image/png,image/jpeg,image/gif,application/pdf,text/plain,application/zip}